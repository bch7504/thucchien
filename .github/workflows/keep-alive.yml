name: Keep Render Awake

# Render's free web service plan sleeps after 15 minutes with no requests, which also freezes the
# in-process APScheduler (reminders, calendar polling) until the next request wakes it back up.
# This ping mitigates - but does not eliminate - that: GitHub's cron scheduler is best-effort and
# can slip by a few minutes at peak load, and GitHub disables scheduled workflows on repos with no
# commits for 60+ days (push a commit or re-enable manually in the Actions tab if that happens).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf "${{ vars.RENDER_URL }}/health" || \
            echo "Ping failed (cold-starting/sleeping) - not failing the workflow, will retry in 10 min"
