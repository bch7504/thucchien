[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p-132-agent"
version = "0.1.0"
description = "AI Agent built with LangGraph"
authors = [
    {name = "Nguyễn Tuấn Thành", email = "tuanthanhtayson@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # AI / LangChain
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    # Calendar & Scheduling (also backs "Sign in with Google" ID-token verification)
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "apscheduler>=3.10.4",
    # Database - PostgreSQL only, no SQLite driver (see ARCHITECTURE.md)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    # Auth
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "cryptography>=43.0.0",
    # httpx: also a runtime dep now (src/services/google_credentials.py calls Google's revoke
    # endpoint on disconnect), not just a test tool - kept here instead of the dev extras below.
    "httpx>=0.28.0",
]

[project.urls]
repository = "https://github.com/AI20K-Build-Phase-Cohort-3/P-132"
